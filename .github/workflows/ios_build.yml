name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build with xcodebuild (no signing)
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build/DerivedData \
            build

      - name: Create IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "Runner.app" -not -path "*/simulator/*" | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r campuslife.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CampusLife-iOS
          path: campuslife.ipa
          retention-days: 7
